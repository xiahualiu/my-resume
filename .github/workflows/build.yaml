name: XeLaTeX

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *"

jobs:
  xelatex:
    name: build-pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LaTeX action
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          compiler: xelatex
          os: debian
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: resume.pdf
          if-no-files-found: error
